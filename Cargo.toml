[package]
keywords = ["elf", "mach-o", "binary", "symbols", "extraction"]
name = "byteripper"
version = "0.1.5"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
description = "Extract binary machine code for functions and symbols from ELF and Mach-O shared libraries with a command-line tool."
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jedisct1/byteripper"
repository = "https://github.com/jedisct1/byteripper"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "cargo",
    "help",
    "usage",
    "error-context",
    "wrap_help",
] }
anyhow = "1.0.104"
goblin = "0.10.7"
libloading = "0.9.0"
thiserror = "2.0.21"
